<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>18-1 · Canvas 粒子文字动画</title>
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: linear-gradient(135deg, #eef3fb 0%, #faf7f2 100%);
            color: #2c3e50;
            padding: 30px 16px 60px;
            min-height: 100vh;
        }

        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.3;
            pointer-events: none;
            z-index: -1;
        }

        body::before {
            width: 420px;
            height: 420px;
            left: -120px;
            top: -80px;
            background: radial-gradient(circle, #8fd3ff 0%, transparent 70%);
        }

        body::after {
            width: 480px;
            height: 480px;
            right: -150px;
            bottom: -120px;
            background: radial-gradient(circle, #c4b5fd 0%, transparent 70%);
        }

        .lm_wrap {
            max-width: 1000px;
            margin: 0 auto;
        }

        .lm_back {
            display: inline-block;
            margin-bottom: 16px;
            font-size: 14px;
            color: #2e6fe3;
            text-decoration: none;
        }

        .lm_back:hover {
            text-decoration: underline;
        }

        h1 {
            text-align: center;
            font-size: 30px;
            margin-bottom: 12px;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
            background: linear-gradient(135deg, #0ea5e9, #6d28d9);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        h1::after {
            content: '';
            display: block;
            width: 46px;
            height: 4px;
            border-radius: 2px;
            margin: 8px auto 0;
            background: linear-gradient(90deg, #0ea5e9, #6d28d9);
        }

        .lm_sub {
            display: table;
            margin: 0 auto 22px;
            padding: 6px 18px;
            background: #fff;
            border: 1px solid #dde8f7;
            border-radius: 999px;
            color: #64748b;
            font-size: 13px;
            box-shadow: 0 2px 8px rgba(23, 54, 125, 0.05);
        }

        /* 画布舞台 */
        .lm_stage {
            position: relative;
            height: clamp(340px, 52vh, 540px);
            border-radius: 18px;
            overflow: hidden;
            cursor: crosshair;
            background: radial-gradient(120% 95% at 50% 0%, #17263f 0%, #0b1220 55%, #060a12 100%);
            border: 1px solid rgba(120, 170, 230, 0.18);
            box-shadow: 0 18px 50px rgba(9, 18, 36, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .lm_stage::before {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(120, 170, 230, 0.055) 1px, transparent 1px),
                linear-gradient(90deg, rgba(120, 170, 230, 0.055) 1px, transparent 1px);
            background-size: 44px 44px;
            mask-image: radial-gradient(circle at 50% 45%, #000 20%, transparent 78%);
            -webkit-mask-image: radial-gradient(circle at 50% 45%, #000 20%, transparent 78%);
        }

        #lm_canvas {
            position: relative;
            display: block;
            width: 100%;
            height: 100%;
        }

        .lm_badge {
            position: absolute;
            left: 16px;
            top: 14px;
            padding: 5px 12px;
            font-size: 12px;
            color: #9fd0f5;
            letter-spacing: 0.5px;
            background: rgba(20, 40, 70, 0.55);
            border: 1px solid rgba(120, 170, 230, 0.25);
            border-radius: 999px;
            pointer-events: none;
            backdrop-filter: blur(4px);
        }

        .lm_live {
            position: absolute;
            right: 16px;
            top: 14px;
            font-size: 12px;
            color: #7dd3fc;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .lm_live i {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #38bdf8;
            box-shadow: 0 0 8px #38bdf8;
            animation: lm_pulse 1.4s ease-in-out infinite;
        }

        @keyframes lm_pulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.35;
                transform: scale(0.7);
            }
        }

        /* 操作栏 */
        .lm_toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            margin-top: 18px;
            padding: 14px 18px;
            background: #fff;
            border: 1px solid #edf0f5;
            border-radius: 14px;
            box-shadow: 0 4px 16px rgba(23, 54, 125, 0.06), 0 1px 3px rgba(23, 54, 125, 0.08);
        }

        .lm_btn {
            padding: 8px 20px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #0ea5e9, #6d28d9);
            color: #fff;
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(14, 165, 233, 0.28);
            transition: all 0.2s;
        }

        .lm_btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 14px rgba(14, 165, 233, 0.38);
        }

        .lm_btn:active {
            transform: translateY(0);
        }

        .lm_btn--ghost {
            background: #fff;
            color: #475569;
            border: 1px solid #dbe3ee;
            box-shadow: none;
        }

        .lm_btn--ghost:hover {
            border-color: #0ea5e9;
            color: #0369a1;
            box-shadow: 0 4px 10px rgba(14, 165, 233, 0.16);
        }

        .lm_hint {
            margin-left: auto;
            font-size: 12.5px;
            color: #94a3b8;
        }

        /* 说明区 */
        .lm_note {
            margin-top: 16px;
            padding: 16px 20px;
            background: #fff;
            border: 1px solid #edf0f5;
            border-left: 4px solid #0ea5e9;
            border-radius: 10px;
            font-size: 13.5px;
            line-height: 1.9;
            color: #5b6b7f;
            box-shadow: 0 4px 16px rgba(23, 54, 125, 0.05);
        }

        .lm_note b {
            color: #0f172a;
        }

        .lm_note code {
            padding: 2px 6px;
            background: #f1f5f9;
            border-radius: 4px;
            color: #0369a1;
            font-size: 12.5px;
        }

        @media (max-width: 640px) {
            h1 {
                font-size: 24px;
                line-height: 1.4;
            }

            .lm_hint {
                margin-left: 0;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- 姓名：吕淼，日期：2026-11-05，功能名称：Canvas 粒子文字动画 -->
    <div class="lm_wrap">
        <a class="lm_back" href="./index.html">← 返回首页</a>
        <h1>Canvas 粒子文字动画</h1>
        <p class="lm_sub">把「吕淼」两个字拆成上千个光点，流散又聚合</p>

        <div class="lm_stage" id="lm_stage">
            <canvas id="lm_canvas"></canvas>
            <span class="lm_badge">canvas 2d · requestAnimationFrame</span>
            <span class="lm_live"><i></i>渲染中</span>
        </div>

        <div class="lm_toolbar">
            <button class="lm_btn" id="lm_regather">重新聚合</button>
            <button class="lm_btn lm_btn--ghost" id="lm_burst">随机炸开</button>
            <button class="lm_btn lm_btn--ghost" id="lm_palette">切换配色</button>
            <span class="lm_hint">移动鼠标推开粒子 · 点击画布炸开 · 粒子数 <b id="lm_count">0</b></span>
        </div>

        <p class="lm_note">
            <b>实现思路：</b>先用离屏 canvas 把「吕淼」绘制出来，逐像素采样得到上千个目标坐标；
            再让粒子在弹簧力（<code>(目标位置 - 当前位置) × 系数</code>）作用下回归，形成文字。
            鼠标位置参与斥力计算，所以能推开粒子；<code>requestAnimationFrame</code> 逐帧重绘，
            并用 <code>globalCompositeOperation = 'lighter'</code> 叠加发光。
        </p>
    </div>

    <script>
        (function () {
            var lm_canvas = document.getElementById('lm_canvas');
            var lm_stage = document.getElementById('lm_stage');
            var lm_ctx = lm_canvas.getContext('2d');
            var lm_countEl = document.getElementById('lm_count');
            var lm_dpr = window.devicePixelRatio || 1;

            var lm_cssW = 0;
            var lm_cssH = 0;
            var lm_parts = [];
            var lm_mouse = { x: -9999, y: -9999 };
            var lm_palIdx = 0;
            var lm_t0 = performance.now();

            // 三套配色，每套三段渐变
            var lm_palettes = [
                ['#38bdf8', '#5eead4', '#a78bfa'],
                ['#fbbf24', '#fb7185', '#f472b6'],
                ['#a3e635', '#22d3ee', '#818cf8']
            ];

            function lm_hex2rgb(lm_hex) {
                return [
                    parseInt(lm_hex.slice(1, 3), 16),
                    parseInt(lm_hex.slice(3, 5), 16),
                    parseInt(lm_hex.slice(5, 7), 16)
                ];
            }

            function lm_mix(lm_a, lm_b, lm_t) {
                return [
                    Math.round(lm_a[0] + (lm_b[0] - lm_a[0]) * lm_t),
                    Math.round(lm_a[1] + (lm_b[1] - lm_a[1]) * lm_t),
                    Math.round(lm_a[2] + (lm_b[2] - lm_a[2]) * lm_t)
                ];
            }

            // 依据横向位置取渐变颜色
            function lm_colorAt(lm_ratio) {
                var lm_pal = lm_palettes[lm_palIdx];
                var lm_c0 = lm_hex2rgb(lm_pal[0]);
                var lm_c1 = lm_hex2rgb(lm_pal[1]);
                var lm_c2 = lm_hex2rgb(lm_pal[2]);
                if (lm_ratio < 0.5) {
                    return lm_mix(lm_c0, lm_c1, lm_ratio / 0.5);
                }
                return lm_mix(lm_c1, lm_c2, (lm_ratio - 0.5) / 0.5);
            }

            // 离屏采样：把文字变成一组目标点
            function lm_sampleText() {
                var lm_off = document.createElement('canvas');
                lm_off.width = Math.round(lm_cssW);
                lm_off.height = Math.round(lm_cssH);
                var lm_offCtx = lm_off.getContext('2d');

                var lm_size = Math.min(lm_cssW * 0.30, lm_cssH * 0.46);
                lm_offCtx.font = 'bold ' + lm_size + 'px "Microsoft YaHei", "PingFang SC", sans-serif';
                lm_offCtx.textAlign = 'center';
                lm_offCtx.textBaseline = 'middle';
                lm_offCtx.fillStyle = '#fff';
                lm_offCtx.fillText('吕淼', lm_cssW / 2, lm_cssH * 0.46);

                var lm_img = lm_offCtx.getImageData(0, 0, lm_off.width, lm_off.height).data;
                var lm_step = lm_cssW < 520 ? 4 : 5;
                var lm_points = [];

                for (var lm_y = 0; lm_y < lm_off.height; lm_y += lm_step) {
                    for (var lm_x = 0; lm_x < lm_off.width; lm_x += lm_step) {
                        if (lm_img[(lm_y * lm_off.width + lm_x) * 4 + 3] > 130) {
                            lm_points.push({ x: lm_x, y: lm_y });
                        }
                    }
                }
                return lm_points;
            }

            // 生成/更新粒子
            function lm_buildParticles() {
                var lm_points = lm_sampleText();
                var lm_minX = Infinity;
                var lm_maxX = -Infinity;

                for (var lm_i = 0; lm_i < lm_points.length; lm_i++) {
                    if (lm_points[lm_i].x < lm_minX) lm_minX = lm_points[lm_i].x;
                    if (lm_points[lm_i].x > lm_maxX) lm_maxX = lm_points[lm_i].x;
                }

                lm_parts = [];
                for (var lm_j = 0; lm_j < lm_points.length; lm_j++) {
                    var lm_pt = lm_points[lm_j];
                    var lm_ratio = (lm_pt.x - lm_minX) / (lm_maxX - lm_minX || 1);
                    var lm_rgb = lm_colorAt(lm_ratio);
                    lm_parts.push({
                        x: lm_cssW / 2 + (Math.random() - 0.5) * lm_cssW,
                        y: lm_cssH / 2 + (Math.random() - 0.5) * lm_cssH,
                        tx: lm_pt.x,
                        ty: lm_pt.y,
                        vx: 0,
                        vy: 0,
                        r: 0.9 + Math.random() * 1.1,
                        ph: Math.random() * Math.PI * 2,
                        rgb: lm_rgb
                    });
                }

                lm_countEl.textContent = lm_parts.length;
            }

            function lm_resize() {
                lm_cssW = lm_stage.clientWidth;
                lm_cssH = lm_stage.clientHeight;
                lm_canvas.width = Math.round(lm_cssW * lm_dpr);
                lm_canvas.height = Math.round(lm_cssH * lm_dpr);
                lm_ctx.setTransform(lm_dpr, 0, 0, lm_dpr, 0, 0);
                lm_buildParticles();
            }

            function lm_burst() {
                for (var lm_i = 0; lm_i < lm_parts.length; lm_i++) {
                    var lm_a = Math.random() * Math.PI * 2;
                    var lm_sp = 5 + Math.random() * 14;
                    lm_parts[lm_i].vx += Math.cos(lm_a) * lm_sp;
                    lm_parts[lm_i].vy += Math.sin(lm_a) * lm_sp;
                }
            }

            function lm_regather() {
                lm_mouse.x = -9999;
                lm_mouse.y = -9999;
                for (var lm_i = 0; lm_i < lm_parts.length; lm_i++) {
                    lm_parts[lm_i].vx *= 0.25;
                    lm_parts[lm_i].vy *= 0.25;
                }
            }

            function lm_frame(lm_now) {
                var lm_t = (lm_now - lm_t0) / 1000;

                lm_ctx.clearRect(0, 0, lm_cssW, lm_cssH);

                // 背景光环
                var lm_cx = lm_cssW / 2;
                var lm_cy = lm_cssH * 0.46;
                var lm_baseR = Math.min(lm_cssW, lm_cssH) * 0.46;

                lm_ctx.save();
                lm_ctx.strokeStyle = 'rgba(120, 180, 240, 0.10)';
                lm_ctx.lineWidth = 1;
                for (var lm_ring = 0; lm_ring < 3; lm_ring++) {
                    var lm_rr = lm_baseR * (0.72 + lm_ring * 0.16) + Math.sin(lm_t * 0.8 + lm_ring) * 4;
                    lm_ctx.beginPath();
                    lm_ctx.arc(lm_cx, lm_cy, lm_rr, 0, Math.PI * 2);
                    lm_ctx.stroke();
                }
                // 旋转的虚线环
                lm_ctx.strokeStyle = 'rgba(94, 234, 212, 0.16)';
                lm_ctx.setLineDash([14, 22]);
                lm_ctx.lineDashOffset = -lm_t * 26;
                lm_ctx.beginPath();
                lm_ctx.arc(lm_cx, lm_cy, lm_baseR * 0.92, 0, Math.PI * 2);
                lm_ctx.stroke();
                lm_ctx.restore();

                // 粒子物理
                for (var lm_i = 0; lm_i < lm_parts.length; lm_i++) {
                    var lm_p = lm_parts[lm_i];

                    var lm_wobbleX = Math.sin(lm_t * 1.1 + lm_p.ph) * 1.1;
                    var lm_wobbleY = Math.cos(lm_t * 1.4 + lm_p.ph) * 1.1;

                    lm_p.vx += (lm_p.tx + lm_wobbleX - lm_p.x) * 0.018;
                    lm_p.vy += (lm_p.ty + lm_wobbleY - lm_p.y) * 0.018;

                    var lm_dx = lm_p.x - lm_mouse.x;
                    var lm_dy = lm_p.y - lm_mouse.y;
                    var lm_d2 = lm_dx * lm_dx + lm_dy * lm_dy;
                    if (lm_d2 < 12100 && lm_d2 > 0.01) {
                        var lm_d = Math.sqrt(lm_d2);
                        var lm_f = (110 - lm_d) / 110 * 3.4;
                        lm_p.vx += lm_dx / lm_d * lm_f;
                        lm_p.vy += lm_dy / lm_d * lm_f;
                    }

                    lm_p.vx *= 0.945;
                    lm_p.vy *= 0.945;
                    lm_p.x += lm_p.vx;
                    lm_p.y += lm_p.vy;
                }

                // 扫描光带位置
                var lm_sweepX = ((lm_t * 0.55) % 1.6 - 0.3) * lm_cssW;

                lm_ctx.globalCompositeOperation = 'lighter';
                for (var lm_k = 0; lm_k < lm_parts.length; lm_k++) {
                    var lm_q = lm_parts[lm_k];
                    var lm_glow = Math.abs(lm_q.x - lm_sweepX) < 42 ? 0.95 : 0.55;
                    var lm_rgb = lm_q.rgb;

                    // 外层柔光
                    lm_ctx.fillStyle = 'rgba(' + lm_rgb[0] + ',' + lm_rgb[1] + ',' + lm_rgb[2] + ',0.10)';
                    lm_ctx.beginPath();
                    lm_ctx.arc(lm_q.x, lm_q.y, lm_q.r * 3.2, 0, Math.PI * 2);
                    lm_ctx.fill();

                    // 粒子本体
                    lm_ctx.fillStyle = 'rgba(' + lm_rgb[0] + ',' + lm_rgb[1] + ',' + lm_rgb[2] + ',' + lm_glow + ')';
                    lm_ctx.beginPath();
                    lm_ctx.arc(lm_q.x, lm_q.y, lm_q.r, 0, Math.PI * 2);
                    lm_ctx.fill();
                }
                lm_ctx.globalCompositeOperation = 'source-over';

                // 底部说明文字（呼吸感）
                var lm_alpha = 0.32 + Math.sin(lm_t * 1.6) * 0.12;
                lm_ctx.save();
                lm_ctx.textAlign = 'center';
                lm_ctx.fillStyle = 'rgba(160, 200, 235, ' + lm_alpha + ')';
                lm_ctx.font = '12px "Microsoft YaHei", sans-serif';
                lm_ctx.fillText('L V   M I A O   ·   C A N V A S   P A R T I C L E', lm_cx, lm_cssH * 0.46 + Math.min(lm_cssW, lm_cssH) * 0.24 + 46);
                lm_ctx.restore();

                requestAnimationFrame(lm_frame);
            }

            // 事件
            lm_stage.addEventListener('mousemove', function (lm_e) {
                var lm_rect = lm_stage.getBoundingClientRect();
                lm_mouse.x = lm_e.clientX - lm_rect.left;
                lm_mouse.y = lm_e.clientY - lm_rect.top;
            });

            lm_stage.addEventListener('mouseleave', function () {
                lm_mouse.x = -9999;
                lm_mouse.y = -9999;
            });

            lm_stage.addEventListener('click', lm_burst);

            document.getElementById('lm_regather').addEventListener('click', lm_regather);
            document.getElementById('lm_burst').addEventListener('click', lm_burst);
            document.getElementById('lm_palette').addEventListener('click', function () {
                lm_palIdx = (lm_palIdx + 1) % lm_palettes.length;
                lm_buildParticles();
            });

            window.addEventListener('resize', lm_resize);

            lm_resize();
            requestAnimationFrame(lm_frame);
        })();
    </script>
</body>
</html>
