<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>930吕淼</title>
    <style>
        h3,p{
            padding:0;
            margin:0;
        }/*群组选择器*/
        #box{
            padding:8px;
            margin:20px;
            border:1px solid #ccc;
            font-size: 12px;
            width: 488px;
        }
        #box h3{
            /* 字体大小16px */
            font-size: 16px;
            /* 行高33px */
            line-height: 33px;
            /* 居中 */
            text-align: center;
            /* 颜色#034 */
            color: #034;
            /* 字间距3px */
            letter-spacing: 3px;
        }
        #box p{
            /* 颜色#666 */
            color: #666;
            /* 首行空两格 */
            text-indent: 2em;
            /* 行高150% */
            line-height: 150%;
        }
        #box a{
            /* 颜色#f11 */
            color: #f11;
            /* 下划线 */
            text-decoration: underline;
        }
        .bb,.xh,.bj{
            /* 蓝色加粗 */
            color: blue;
            font-weight: bold;
        }
        h2{
        background-color: black;
        color:white;
        text-align: center;
        line-height: 150%;
        }
        .zsd{
            background-color: rgb(25, 167, 214);
            color:white;
        }
    </style>
</head>
<body>
    <h2>css群组选择器和后代选择器</h2>
    <div id="box">
        <h3>CSS进阶</h3>
        <p>学号：<span class="xh">930</span>，姓名：<span class="bb">吕淼</span>，班级：<span class="bj">计算机24009</span>，《高级网页设计》的学习难度：中等，
            本实例的<span class="zsd">知识点</span>：CSS群组选择器和后代选择器。
            <a href="#">【更多】</a>
        </p>
    </div>
    
</body>
</html>
