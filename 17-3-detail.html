<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>17-3 · 商品详情页</title>
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: #f3f5f8;
            color: #2c3e50;
            padding: 30px 16px 60px;
        }

        .lm_wrap {
            max-width: 900px;
            margin: 0 auto;
        }

        .lm_back {
            display: inline-block;
            margin-bottom: 16px;
            font-size: 14px;
            color: #2e6fe3;
            text-decoration: none;
        }

        .lm_back:hover {
            text-decoration: underline;
        }

        .lm_tip {
            text-align: center;
            padding: 60px 0;
            color: #7b8794;
            font-size: 15px;
        }

        .lm_tip--err {
            color: #c0392b;
        }

        /* 详情卡片 */
        .lm_detail {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 10px rgba(30, 50, 80, 0.08);
            padding: 26px 28px;
            display: flex;
            gap: 28px;
            flex-wrap: wrap;
        }

        /* 左侧图片区 */
        .lm_media {
            flex: 0 0 320px;
            max-width: 100%;
        }

        .lm_mainimg {
            width: 100%;
            height: 300px;
            object-fit: contain;
            border: 1px solid #eef1f5;
            border-radius: 8px;
            padding: 10px;
        }

        .lm_thumbs {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .lm_thumbs img {
            width: 64px;
            height: 64px;
            object-fit: contain;
            border: 2px solid #e3e8ef;
            border-radius: 6px;
            padding: 4px;
            cursor: pointer;
            background: #fff;
        }

        .lm_thumbs img:hover,
        .lm_thumbs img.lm_on {
            border-color: #2e6fe3;
        }

        /* 右侧信息区 */
        .lm_info {
            flex: 1;
            min-width: 260px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .lm_cat {
            font-size: 13px;
            color: #7b8794;
        }

        .lm_cat b {
            color: #2e6fe3;
        }

        h1 {
            font-size: 24px;
            color: #2c3e50;
            line-height: 1.4;
        }

        .lm_pricebox {
            display: flex;
            align-items: baseline;
            gap: 12px;
        }

        .lm_price {
            color: #c0171f;
            font-size: 30px;
            font-weight: bold;
        }

        .lm_price::before {
            content: "$";
            font-size: 18px;
        }

        .lm_discount {
            color: #16a085;
            font-size: 15px;
            background: #e8f7f2;
            border-radius: 5px;
            padding: 3px 8px;
        }

        .lm_rating {
            font-size: 14px;
            color: #e67e22;
        }

        .lm_desc {
            font-size: 15px;
            line-height: 1.9;
            color: #55606e;
            border-top: 1px dashed #dfe5ec;
            padding-top: 14px;
        }

        .lm_kv {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 8px;
            font-size: 14px;
        }

        .lm_kv div {
            background: #f6f8fb;
            border-radius: 6px;
            padding: 8px 12px;
        }

        .lm_kv b {
            color: #17367d;
        }

        .lm_tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .lm_tags span {
            font-size: 12px;
            color: #2e6fe3;
            background: #eef3fa;
            border-radius: 20px;
            padding: 4px 12px;
        }

        .lm_err {
            background: #fdf0ef;
            border: 1px solid #f2c6c2;
            color: #c0392b;
            border-radius: 8px;
            padding: 16px 20px;
            font-size: 15px;
            line-height: 1.8;
        }
    </style>
</head>
<body>
    <!-- 姓名：袁磊，日期：2026-11-02，功能名称：商品详情页（根据 URL 参数中的 id 用 fetch 获取单个商品） -->
    <div class="lm_wrap">
        <a class="lm_back" href="./17-3.html">← 返回商品列表</a>
        <a class="lm_back" href="./index.html">← 返回首页</a>

        <div class="lm_tip" id="lm_tip">正在加载商品详情……</div>
        <div id="lm_box"></div>
    </div>

    <script>
        // 一、从 URL 参数中取出商品 id：17-3-detail.html?id=1
        var lm_params = new URLSearchParams(window.location.search);
        var lm_id = lm_params.get('id') || '1';     // 没传 id 时默认展示 1 号商品

        document.title = '商品详情 #' + lm_id;

        // 二、根据 id 请求详情接口：https://dummyjson.com/products/{id}
        fetch('https://dummyjson.com/products/' + lm_id)
            .then(function (lm_res) {
                if (!lm_res.ok) {
                    throw new Error('HTTP 状态码：' + lm_res.status);
                }
                return lm_res.json();
            })
            .then(function (lm_p) {
                document.getElementById('lm_tip').style.display = 'none';
                document.title = lm_p.title + ' · 商品详情';
                lm_render(lm_p);
            })
            .catch(function (lm_err) {
                document.getElementById('lm_tip').style.display = 'none';
                document.getElementById('lm_box').innerHTML =
                    '<div class="lm_err">商品详情获取失败：' + lm_err.message +
                    '<br>请确认 id 是否存在（例如 <b>17-3-detail.html?id=1</b>），或检查网络后刷新重试。</div>';
            });

        // 三、渲染详情
        function lm_render(lm_p) {
            var lm_imgHtml = '';
            for (var lm_i = 0; lm_i < lm_p.images.length; lm_i++) {
                lm_imgHtml += '<img src="' + lm_p.images[lm_i] + '" alt="图' + (lm_i + 1) + '"' +
                    (lm_i === 0 ? ' class="lm_on"' : '') + '>';
            }

            var lm_tagHtml = '';
            for (var lm_t = 0; lm_t < lm_p.tags.length; lm_t++) {
                lm_tagHtml += '<span>' + lm_p.tags[lm_t] + '</span>';
            }

            document.getElementById('lm_box').innerHTML =
                '<div class="lm_detail">' +
                    '<div class="lm_media">' +
                        '<img class="lm_mainimg" id="lm_mainimg" src="' + lm_p.images[0] + '" alt="' + lm_p.title + '">' +
                        '<div class="lm_thumbs" id="lm_thumbs">' + lm_imgHtml + '</div>' +
                    '</div>' +
                    '<div class="lm_info">' +
                        '<div class="lm_cat">分类：<b>' + lm_p.category + '</b> · 品牌：' + (lm_p.brand || '暂无') + '</div>' +
                        '<h1>' + lm_p.title + '</h1>' +
                        '<div class="lm_pricebox">' +
                            '<span class="lm_price">' + lm_p.price.toFixed(2) + '</span>' +
                            '<span class="lm_discount">优惠 ' + lm_p.discountPercentage.toFixed(1) + '%</span>' +
                        '</div>' +
                        '<div class="lm_rating">★ 评分 ' + lm_p.rating + ' · 库存 ' + lm_p.stock + ' 件</div>' +
                        '<div class="lm_desc">' + lm_p.description + '</div>' +
                        '<div class="lm_kv">' +
                            '<div><b>SKU：</b>' + lm_p.sku + '</div>' +
                            '<div><b>保修：</b>' + lm_p.warrantyInformation + '</div>' +
                            '<div><b>退换：</b>' + lm_p.returnPolicy + '</div>' +
                            '<div><b>物流：</b>' + lm_p.shippingInformation + '</div>' +
                        '</div>' +
                        '<div class="lm_tags">' + lm_tagHtml + '</div>' +
                    '</div>' +
                '</div>';

            // 点击缩略图切换主图
            var lm_thumbs = document.getElementById('lm_thumbs');
            lm_thumbs.addEventListener('click', function (lm_e) {
                if (lm_e.target.tagName === 'IMG') {
                    document.getElementById('lm_mainimg').src = lm_e.target.src;
                    lm_thumbs.querySelectorAll('img').forEach(function (lm_img) {
                        lm_img.classList.remove('lm_on');
                    });
                    lm_e.target.classList.add('lm_on');
                }
            });
        }
    </script>
</body>
</html>
