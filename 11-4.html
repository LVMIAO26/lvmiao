<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 画廊 - 930吕淼</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            overflow: hidden;
        }

        .lv_scene {
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1200px;
        }

        .lv_carousel {
            position: relative;
            width: 220px;
            height: 300px;
            transform-style: preserve-3d;
            animation: lv_spin 18s linear infinite;
        }

        .lv_carousel:hover {
            animation-play-state: paused;
        }

        @keyframes lv_spin {
            from { transform: rotateY(0deg); }
            to { transform: rotateY(360deg); }
        }

        .lv_panel {
            position: absolute;
            width: 220px;
            height: 300px;
            left: 0;
            top: 0;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            backface-visibility: hidden;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.4);
        }

        .lv_panel .lv_num {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .lv_panel .lv_label {
            font-size: 14px;
            opacity: 0.8;
        }

        .lv_panel:nth-child(1) { background: linear-gradient(135deg, #6c5ce7, #a29bfe); transform: rotateY(0deg) translateZ(300px); }
        .lv_panel:nth-child(2) { background: linear-gradient(135deg, #00b894, #55efc4); transform: rotateY(45deg) translateZ(300px); }
        .lv_panel:nth-child(3) { background: linear-gradient(135deg, #0984e3, #74b9ff); transform: rotateY(90deg) translateZ(300px); }
        .lv_panel:nth-child(4) { background: linear-gradient(135deg, #e17055, #fab1a0); transform: rotateY(135deg) translateZ(300px); }
        .lv_panel:nth-child(5) { background: linear-gradient(135deg, #fdcb6e, #ffeaa7); transform: rotateY(180deg) translateZ(300px); }
        .lv_panel:nth-child(6) { background: linear-gradient(135deg, #e84393, #fd79a8); transform: rotateY(225deg) translateZ(300px); }
        .lv_panel:nth-child(7) { background: linear-gradient(135deg, #00cec9, #81ecec); transform: rotateY(270deg) translateZ(300px); }
        .lv_panel:nth-child(8) { background: linear-gradient(135deg, #a29bfe, #dfe6e9); transform: rotateY(315deg) translateZ(300px); }

        .lv_title {
            position: absolute;
            top: 30px;
            width: 100%;
            text-align: center;
            font-size: 30px;
            letter-spacing: 2px;
            background: linear-gradient(120deg, #6c5ce7, #00b894 60%, #0984e3);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .lv_hint {
            position: absolute;
            bottom: 60px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
        }

        .lv_back {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: #a29bfe;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }
        .lv_back:hover {
            color: #00b894;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h2 class="lv_title">3D 画廊</h2>
    <div class="lv_scene">
        <div class="lv_carousel">
            <div class="lv_panel"><span class="lv_num">1</span><span class="lv_label">紫罗兰</span></div>
            <div class="lv_panel"><span class="lv_num">2</span><span class="lv_label">翡翠绿</span></div>
            <div class="lv_panel"><span class="lv_num">3</span><span class="lv_label">天空蓝</span></div>
            <div class="lv_panel"><span class="lv_num">4</span><span class="lv_label">珊瑚橙</span></div>
            <div class="lv_panel"><span class="lv_num">5</span><span class="lv_label">琥珀黄</span></div>
            <div class="lv_panel"><span class="lv_num">6</span><span class="lv_label">玫瑰粉</span></div>
            <div class="lv_panel"><span class="lv_num">7</span><span class="lv_label">青碧色</span></div>
            <div class="lv_panel"><span class="lv_num">8</span><span class="lv_label">薰衣草</span></div>
        </div>
    </div>
    <p class="lv_hint">鼠标悬停可暂停旋转</p>
    <a class="lv_back" href="./index.html">← 返回首页</a>
</body>
</html>
