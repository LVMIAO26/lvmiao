<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Grid 布局</title>
    <style>
        body {
            font-family: "Microsoft YaHei", sans-serif;
            margin: 0;
            padding: 40px;
            background: #f0f2f5;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
        }

        .lv_grid {
            display: grid;
            grid-template-columns: 1fr 1.5fr 1fr;
            grid-template-rows: repeat(4, 120px);
            gap: 12px;
            max-width: 700px;
            margin: 30px auto;
        }

        .lv_item {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            color: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .lv_a {
            grid-row: 1;
            grid-column: 1;
            background: #3498db;
        }

        .lv_b {
            grid-row: 1 / 3;
            grid-column: 2 / 4;
            background: #2ecc71;
        }

        .lv_c {
            grid-row: 2 / 5;
            grid-column: 1;
            background: #e74c3c;
        }

        .lv_d {
            grid-row: 3 / 5;
            grid-column: 2;
            background: #f39c12;
        }

        .lv_e {
            grid-row: 3;
            grid-column: 3;
            background: #9b59b6;
        }

        .lv_f {
            grid-row: 4;
            grid-column: 3;
            background: #1abc9c;
        }

        .lv_name {
            text-align: center;
            font-size: 24px;
            color: #7f8c8d;
            margin-top: 20px;
        }

        .lv_back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #3498db;
            text-decoration: none;
        }

        .lv_back:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>CSS Grid 布局</h1>

    <div class="lv_grid">
        <div class="lv_item lv_a">a</div>
        <div class="lv_item lv_b">b</div>
        <div class="lv_item lv_c">c</div>
        <div class="lv_item lv_d">d</div>
        <div class="lv_item lv_e">e</div>
        <div class="lv_item lv_f">f</div>
    </div>

    <div class="lv_name">吕淼</div>
    <a class="lv_back" href="./index.html">← 返回首页</a>
</body>
</html>
