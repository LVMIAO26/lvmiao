<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>930吕淼</title>
    <style>
        h3{
            color: white;
        }
        p{
            color: blue;
        }
        #box{
            width: 500px;
            height: 500px;
            background-color: #ccc;
        }
        /* id选择器 以#开始,增一*/
        .n1{
            color: #7A9;
        }
        h2{
            color: white;
            background-color: black;
        }
        .n2{
            color: #6D9;
        }
        /* 新加的学号盒子：设置宽、高、背景色 */
        #sid{
            width: 300px;
            height: 120px;
            background-color: #FFC0CB;
            margin-top: 20px;
            text-align: center;
            line-height: 120px;
            font-size: 48px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>
    <h2>层叠样式表CSS</h2>
    <div id="box">
        <h3>CSS选择器</h3>
        <P><span class="n1">吕</span><span class="n2">淼</span></P>
        <P>CSS属性</P>
    </div>
    <!--新加的盒子：宽300px、高120px、粉红背景，内容为学号-->
    <div id="sid">930吕淼</div>
</body>
</html>
