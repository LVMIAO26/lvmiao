<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    /* 全局CSS */
    *{
        margin: 0;
        padding: 0;
    }
    ul{list-style:none;}
    img{
        display:block;
    }
    .slist{
        display:flex;
    }
    .slist li{
        width:30%;
        margin-right: 3px;
        flex-grow:1;
        /* 相对定位 */
        position: relative;
    }
    .slist img{
        width:100%;
    }
    .slist p{
        font-size:14px;
        text-align: center;
        line-height: 24px;
        /* 绝对定位 */
        position: absolute;
        bottom: 0;
        left:0;
        width: 100%;
        background-color: rgba(0,0,0,0.5);
        color: white;
        /* 加粗 */
        font-weight: bold;
    }
    
</style>
<body>
    <ul class="slist">
        <li>
            <Img src="./img/7-1-2.jpg">
            <p>吕淼的标题1</p>
        </li>
        <li>
            <Img src="./img/7-1-3.jpg">
            <p>吕淼的标题2</p>
        </li>
        <li>
            <Img src="./img/7-1-2.jpg">
            <p>吕淼的标题3</p>
        </li>
    </ul>
</body>
</html>
