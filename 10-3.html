<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>10-3 视口响应</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      font-size: 16px;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f3f4f6;
      font-family: "Microsoft YaHei", Arial, sans-serif;
    }

    .fullscreen {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #7dd3fc;
      transition: background-color 0.5s ease;
    }

    .content {
      text-align: center;
      color: #ffffff;
      text-shadow: 0 0.25rem 0.8rem rgba(0, 0, 0, 0.25);
      font-size: 3rem;
      letter-spacing: 0.2rem;
      font-weight: 700;
    }

    @media (max-width: 1200px) {
      .fullscreen {
        background: #93c5fd;
      }
      .content {
        font-size: 2.5rem;
      }
    }

    @media (max-width: 900px) {
      .fullscreen {
        background: #a7f3d0;
      }
      .content {
        font-size: 2rem;
      }
    }

    @media (max-width: 600px) {
      html {
        font-size: 14px;
      }

      .fullscreen {
        background: #f9a8d4;
      }

      .content {
        font-size: 1.8rem;
        letter-spacing: 0.1rem;
      }
    }
  </style>
</head>
<body>
  <div class="fullscreen">
    <div class="content">吕淼</div>
  </div>
</body>
</html>
