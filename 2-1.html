<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>930吕淼</title>
</head>
<body>
    <h2>HTML元素：开始标签+内容+结束标记</h2>
    <h3>内容与样式分离</h3>
    <h4>山居秋暝</h4>
    空山新雨后，<br>
    天气晚来秋。<br>
    <p>明月松间照，</p>
    <p>清泉石上流。</p>
    <h4>93阅兵展示的武器列表</h4>
    <ul>
        <li>东风</li>
        <li>鹰击</li>
        <li>长缨</li>
        <li>巨浪</li>
        <li>霹雳</li>
    </ul>
    <!--区域-->
    <!--注释：crtl+ / -->
    <div style="background-color: #12abcd;width: 400px;height: 200px;">
        盒子
        <div>
            <span style="color: #f956cb;font-size:50px">吕</span>
            <span style="color: #b96ae4;font-size:50px">淼</span>
            <!--行间元素：可以和其他元素在同一行-->
        </div>
    </div>
</body>
</html>
