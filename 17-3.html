<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>17-3 · 商品列表页</title>
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: #f3f5f8;
            color: #2c3e50;
            padding: 30px 16px 60px;
        }

        .lm_wrap {
            max-width: 1080px;
            margin: 0 auto;
        }

        .lm_back {
            display: inline-block;
            margin-bottom: 16px;
            font-size: 14px;
            color: #2e6fe3;
            text-decoration: none;
        }

        .lm_back:hover {
            text-decoration: underline;
        }

        h1 {
            text-align: center;
            font-size: 28px;
            color: #17367d;
            margin-bottom: 6px;
        }

        .lm_sub {
            text-align: center;
            color: #7b8794;
            font-size: 14px;
            margin-bottom: 22px;
        }

        .lm_sub code {
            font-family: Consolas, monospace;
            background: #e8edf4;
            color: #c0392b;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .lm_status {
            text-align: center;
            color: #7b8794;
            font-size: 14px;
            margin-bottom: 16px;
        }

        .lm_status b {
            color: #16a085;
        }

        .lm_tip {
            text-align: center;
            padding: 60px 0;
            color: #7b8794;
            font-size: 15px;
        }

        .lm_tip--err {
            color: #c0392b;
        }

        /* 商品网格：整卡为超链接，点击进入详情页 */
        .lm_grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 16px;
        }

        .lm_card {
            background: #fff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 10px rgba(30, 50, 80, 0.08);
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            transition: transform .25s, box-shadow .25s;
        }

        .lm_card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(30, 50, 80, 0.14);
        }

        .lm_card img {
            width: 100%;
            height: 160px;
            object-fit: contain;
            border-bottom: 1px solid #eef1f5;
            padding: 8px;
            background: #fff;
        }

        .lm_body {
            padding: 12px 14px 14px;
            display: flex;
            flex-direction: column;
            gap: 7px;
            flex: 1;
        }

        .lm_title {
            font-size: 15px;
            font-weight: bold;
            color: #2c3e50;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 42px;
        }

        .lm_meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #7b8794;
        }

        .lm_price {
            color: #c0171f;
            font-size: 17px;
            font-weight: bold;
        }

        .lm_price::before {
            content: "$";
            font-size: 12px;
        }

        .lm_go {
            margin-top: auto;
            font-size: 13px;
            color: #2e6fe3;
        }

        .lm_card:hover .lm_go {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <!-- 姓名：袁磊，日期：2026-11-02，功能名称：商品列表页（fetch 获取数据，点击进入详情页） -->
    <div class="lm_wrap">
        <a class="lm_back" href="./index.html">← 返回首页</a>

        <h1>商品列表</h1>
        <p class="lm_sub">接口：<code>https://dummyjson.com/products?limit=8</code> · 点击卡片查看详情</p>

        <div class="lm_status" id="lm_status">正在请求数据……</div>

        <div class="lm_tip" id="lm_tip">数据加载中，请稍候……</div>

        <div class="lm_grid" id="lm_grid"></div>
    </div>

    <script>
        var lm_api = 'https://dummyjson.com/products?limit=8';

        // 用 fetch 请求商品列表（Promise 链式写法）
        fetch(lm_api)
            .then(function (lm_res) {
                if (!lm_res.ok) {
                    throw new Error('HTTP 状态码：' + lm_res.status);
                }
                return lm_res.json();
            })
            .then(function (lm_data) {
                document.getElementById('lm_status').innerHTML =
                    '请求成功：共 <b>' + lm_data.total + '</b> 件商品，本页展示 ' + lm_data.products.length + ' 件';
                document.getElementById('lm_tip').style.display = 'none';
                lm_render(lm_data.products);
            })
            .catch(function (lm_err) {
                var lm_tip = document.getElementById('lm_tip');
                lm_tip.className = 'lm_tip lm_tip--err';
                lm_tip.textContent = '数据获取失败：' + lm_err.message + '（请检查网络连接后刷新重试）';
            });

        // 渲染列表：每张卡片是超链接，把商品 id 通过 URL 参数传给详情页
        function lm_render(lm_products) {
            var lm_html = '';
            for (var lm_i = 0; lm_i < lm_products.length; lm_i++) {
                var lm_p = lm_products[lm_i];
                lm_html += '<a class="lm_card" href="./17-3-detail.html?id=' + lm_p.id + '">' +
                    '<img src="' + lm_p.thumbnail + '" alt="' + lm_p.title + '" loading="lazy">' +
                    '<div class="lm_body">' +
                        '<div class="lm_title" title="' + lm_p.title + '">' + lm_p.title + '</div>' +
                        '<div class="lm_meta"><span>' + lm_p.category + '</span><span>评分 ' + lm_p.rating + '</span></div>' +
                        '<div class="lm_meta"><span class="lm_price">' + lm_p.price.toFixed(2) + '</span>' +
                        '<span>库存 ' + lm_p.stock + '</span></div>' +
                        '<span class="lm_go">查看详情 →</span>' +
                    '</div></a>';
            }
            document.getElementById('lm_grid').innerHTML = lm_html;
        }
    </script>
</body>
</html>
