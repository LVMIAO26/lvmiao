<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>吕淼：JavaScript</h2>
    <script>
        //输出，吕淼，你好，document、alert、console三种方式
        document.write("吕淼，你好");
        alert("吕淼，你好");
        console.log("吕淼，你好");
        //confirm和prompt方法
        confirm("你确定吗？");
        prompt("请输入你的姓名");
        
    </script>
</body>
</html>
