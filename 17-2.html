<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>17-2 · fetch 获取商品数据</title>
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: #f3f5f8;
            color: #2c3e50;
            padding: 30px 16px 60px;
        }

        .lm_wrap {
            max-width: 1080px;
            margin: 0 auto;
        }

        .lm_back {
            display: inline-block;
            margin-bottom: 16px;
            font-size: 14px;
            color: #2e6fe3;
            text-decoration: none;
        }

        .lm_back:hover {
            text-decoration: underline;
        }

        h1 {
            text-align: center;
            font-size: 28px;
            color: #17367d;
            margin-bottom: 6px;
        }

        .lm_sub {
            text-align: center;
            color: #7b8794;
            font-size: 14px;
            margin-bottom: 22px;
        }

        .lm_sub code {
            font-family: Consolas, monospace;
            background: #e8edf4;
            color: #c0392b;
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* 工具栏：状态 + 分类筛选 */
        .lm_toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            background: #fff;
            border-radius: 10px;
            padding: 14px 18px;
            box-shadow: 0 2px 10px rgba(30, 50, 80, 0.08);
            margin-bottom: 18px;
            font-size: 14px;
        }

        .lm_status {
            color: #7b8794;
        }

        .lm_status b {
            color: #16a085;
        }

        .lm_select {
            padding: 7px 12px;
            border: 1px solid #c6d6ea;
            border-radius: 6px;
            font-size: 14px;
            color: #2c3e50;
            background: #fff;
        }

        /* 加载与错误提示 */
        .lm_tip {
            text-align: center;
            padding: 60px 0;
            color: #7b8794;
            font-size: 15px;
        }

        .lm_tip--err {
            color: #c0392b;
        }

        /* 商品网格 */
        .lm_grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
        }

        .lm_card {
            background: #fff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 10px rgba(30, 50, 80, 0.08);
            display: flex;
            flex-direction: column;
            transition: transform .25s, box-shadow .25s;
        }

        .lm_card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(30, 50, 80, 0.14);
        }

        .lm_card img {
            width: 100%;
            height: 150px;
            object-fit: contain;
            background: #fff;
            border-bottom: 1px solid #eef1f5;
            padding: 8px;
        }

        .lm_body {
            padding: 12px 14px 14px;
            display: flex;
            flex-direction: column;
            gap: 7px;
            flex: 1;
        }

        .lm_title {
            font-size: 15px;
            font-weight: bold;
            color: #2c3e50;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 42px;
        }

        .lm_meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #7b8794;
        }

        .lm_price {
            color: #c0171f;
            font-size: 17px;
            font-weight: bold;
        }

        .lm_price::before {
            content: "$";
            font-size: 12px;
        }

        .lm_stock {
            font-size: 12px;
        }

        .lm_stock--low {
            color: #e67e22;
        }

        .lm_stock--ok {
            color: #16a085;
        }

        /* 原始 JSON 折叠区 */
        .lm_raw {
            margin-top: 22px;
        }

        .lm_raw summary {
            cursor: pointer;
            font-size: 15px;
            color: #17367d;
            font-weight: bold;
            padding: 10px 0;
        }

        .lm_json {
            background: #1e2733;
            color: #e8edf4;
            font-family: Consolas, "Courier New", monospace;
            font-size: 13px;
            line-height: 1.7;
            border-radius: 8px;
            padding: 16px 18px;
            overflow-x: auto;
            white-space: pre;
            max-height: 420px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <!-- 姓名：袁磊，日期：2026-11-02，功能名称：fetch 获取远程商品数据并展示 -->
    <div class="lm_wrap">
        <a class="lm_back" href="./index.html">← 返回首页</a>

        <h1>fetch 获取商品数据</h1>
        <p class="lm_sub">接口：<code>https://dummyjson.com/products</code>（允许跨域）· 使用原生 <code>fetch</code> + <code>Promise</code> 实现</p>

        <div class="lm_toolbar">
            <span class="lm_status" id="lm_status">正在请求数据……</span>
            <label>
                分类筛选：
                <select class="lm_select" id="lm_category">
                    <option value="">全部分类</option>
                </select>
            </label>
        </div>

        <div class="lm_tip" id="lm_tip">数据加载中，请稍候……</div>

        <div class="lm_grid" id="lm_grid"></div>

        <details class="lm_raw">
            <summary>查看第一个商品的原始 JSON 数据</summary>
            <div class="lm_json" id="lm_rawJson">暂无数据</div>
        </details>
    </div>

    <script>
        var lm_api = 'https://dummyjson.com/products';
        var lm_allProducts = [];   // 缓存全部商品，用于分类筛选

        // 渲染商品卡片列表
        function lm_render(lm_list) {
            var lm_grid = document.getElementById('lm_grid');
            var lm_html = '';
            for (var lm_i = 0; lm_i < lm_list.length; lm_i++) {
                var lm_p = lm_list[lm_i];
                var lm_stockCls = lm_p.stock < 20 ? ' lm_stock--low' : ' lm_stock--ok';
                var lm_stockTxt = lm_p.stock < 20 ? '库存紧张：' : '库存充足：';
                lm_html += '<div class="lm_card">' +
                    '<img src="' + lm_p.thumbnail + '" alt="' + lm_p.title + '" loading="lazy">' +
                    '<div class="lm_body">' +
                        '<div class="lm_title" title="' + lm_p.title + '">' + lm_p.title + '</div>' +
                        '<div class="lm_meta"><span>' + lm_p.category + '</span><span>评分 ' + lm_p.rating + '</span></div>' +
                        '<div class="lm_meta"><span class="lm_price">' + lm_p.price.toFixed(2) + '</span>' +
                        '<span class="lm_stock' + lm_stockCls + '">' + lm_stockTxt + lm_p.stock + '</span></div>' +
                    '</div></div>';
            }
            lm_grid.innerHTML = lm_html;
        }

        // 填充分类下拉框
        function lm_fillCategory(lm_list) {
            var lm_seen = {};
            var lm_select = document.getElementById('lm_category');
            for (var lm_i = 0; lm_i < lm_list.length; lm_i++) {
                var lm_c = lm_list[lm_i].category;
                if (!lm_seen[lm_c]) {
                    lm_seen[lm_c] = true;
                    var lm_opt = document.createElement('option');
                    lm_opt.value = lm_c;
                    lm_opt.textContent = lm_c;
                    lm_select.appendChild(lm_opt);
                }
            }
        }

        // 用 fetch 请求接口（Promise 链式写法）
        fetch(lm_api)
            .then(function (lm_res) {
                if (!lm_res.ok) {                     // HTTP 状态码不是 2xx 时抛错
                    throw new Error('HTTP 状态码：' + lm_res.status);
                }
                return lm_res.json();                 // 把响应体解析为 JSON
            })
            .then(function (lm_data) {
                lm_allProducts = lm_data.products;
                document.getElementById('lm_status').innerHTML =
                    '请求成功：共 <b>' + lm_data.total + '</b> 件商品，本页展示 ' + lm_allProducts.length + ' 件';
                document.getElementById('lm_tip').style.display = 'none';
                document.getElementById('lm_rawJson').textContent =
                    JSON.stringify(lm_data.products[0], null, 2);
                lm_fillCategory(lm_allProducts);
                lm_render(lm_allProducts);
            })
            .catch(function (lm_err) {                // 网络错误、解析错误统一在这里处理
                var lm_tip = document.getElementById('lm_tip');
                lm_tip.className = 'lm_tip lm_tip--err';
                lm_tip.textContent = '数据获取失败：' + lm_err.message + '（请检查网络连接后刷新重试）';
            });

        // 分类筛选：切换下拉框时重新渲染
        document.getElementById('lm_category').addEventListener('change', function () {
            var lm_val = this.value;
            if (lm_val === '') {
                lm_render(lm_allProducts);
            } else {
                lm_render(lm_allProducts.filter(function (lm_p) {
                    return lm_p.category === lm_val;
                }));
            }
        });
    </script>
</body>
</html>
