<style>

    /* ===== 演示舞台 ===== */

    .lm_code {

    .lm_arr-row { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 18px; }

    .lm_formula {

    /* ===== 数组格子 ===== */
    .lm_cell {
        position: relative;
        min-width: 62px; height: 62px;
        display: flex; align-items: center; justify-content: center;

        border-radius: 10px;

        padding: 4px 8px;
        animation: popIn .35s ease both;
        animation-delay: var(--d, 0s);
    }
    .lm_cell .lm_idx {
        position: absolute; top: -9px; left: 50%;
        transform: translateX(-50%);
        background: #94a3b8; color: #fff;
        font-size: 10px; line-height: 1;
        padding: 2px 6px; border-radius: 8px;
        font-family: Consolas, monospace;
    }

    /* 数字/字符串值样式 */
    .lm_cell.lm_num { font-family: Consolas, monospace; font-size: 20px; font-weight: 700; color: #334155; }
    .lm_cell.lm_strval { font-family: Consolas, monospace; font-size: 15px; color: #334155; }

    /* 嵌套数组（flat 演示） */
    .lm_cell.lm_nested { gap: 5px; padding: 4px 10px; }
    .lm_cell .lm_subcell {
        min-width: 34px; height: 40px;
        display: flex; align-items: center; justify-content: center;
        background: #eef2f7; border: 1px solid #cbd5e1;
        border-radius: 6px;
        font-size: 16px;
        font-family: Consolas, monospace; font-weight: 700; color: #334155;
        padding: 2px 5px;
    }

    /* 标记状态 */
    .lm_cell.lm_removed {
        background: #fee2e2; border-color: #dc2626;
        animation: shake .55s ease both;
        animation-delay: var(--d, 0s);
    }
    .lm_cell.lm_matched {
        background: #dcfce7; border-color: #16a34a;
        animation: pulseG 1.1s ease 2 both;
        animation-delay: var(--d, 0s);
    }
    .lm_cell.lm_added {
        background: #dcfce7; border-color: #16a34a;
        animation: popBig .5s cubic-bezier(.34,1.56,.64,1) both;
        animation-delay: var(--d, 0s);
    }
    .lm_cell.lm_changed {
        background: #dbeafe; border-color: #2563b0;
        animation: popBig .5s cubic-bezier(.34,1.56,.64,1) both;
        animation-delay: var(--d, 0s);
    }
    .lm_cell.lm_inrange { border-color: #2563b0; box-shadow: 0 0 0 3px rgba(37,99,176,.25); }
    .lm_cell.lm_dimmed { opacity: .35; }
    .lm_cell.lm_dimmed::after {
        content: "✕";
        position: absolute;
        color: #dc2626; font-size: 30px; font-weight: 700;
    }
    .lm_cell.lm_seq { animation: pulseB .55s ease both; animation-delay: calc(var(--i,0) * .28s); }

    /* ===== 方法面板 ===== */

    .lm_btns { display: flex; flex-wrap: wrap; gap: 10px; }

    .lm_btns button:hover { background: #dbe7f7; transform: translateY(-2px); }
    .lm_btns button.lm_active {
        background: linear-gradient(135deg, #17458a, #2563b0);
        color: #fff; border-color: transparent;
        box-shadow: 0 4px 12px rgba(23,69,138,.35);
    }

    footer { text-align: center; font-size: 12px; color: #999; padding-bottom: 30px; }

    /* ===== 动画 ===== */
    @keyframes popIn { from { opacity: 0; transform: scale(.7); } to { opacity: 1; transform: scale(1); } }
    @keyframes popBig { 0% { opacity: 0; transform: scale(.4); } 60% { transform: scale(1.15); } 100% { opacity: 1; transform: scale(1); } }
    @keyframes shake {
        0%,100% { transform: translateX(0); }
        20% { transform: translateX(-6px); } 40% { transform: translateX(6px); }
        60% { transform: translateX(-4px); } 80% { transform: translateX(4px); }
    }
    @keyframes pulseG {
        0%,100% { box-shadow: 0 0 0 0 rgba(22,163,74,.4); }
        50% { box-shadow: 0 0 0 8px rgba(22,163,74,0); }
    }
    @keyframes pulseB {
        0%,100% { box-shadow: 0 0 0 0 rgba(37,99,176,.45); background: #fff; }
        50% { box-shadow: 0 0 0 8px rgba(37,99,176,0); background: #dbeafe; }
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    @media (max-width: 640px) {
        .lm_arr-row { flex-direction: column; gap: 6px; }

        .lm_hero h1 { font-size: 22px; }
        .lm_stage { padding: 20px 16px; }
    }


    /* 返回首页链接 */
    .lm_back {
        display: inline-block;
        margin-bottom: 8px;
        color: #fff;
        background: rgba(255,255,255,.18);
        border: 1px solid rgba(255,255,255,.35);
        padding: 4px 14px;
        border-radius: 20px;
        font-size: 13px;
        transition: background .2s ease;
    }
    .lm_back:hover { background: rgba(255,255,255,.32); }

<body>
    <!-- 姓名：袁磊，日期：2026-10-29，功能名称：JavaScript 数组方法图解 -->

<header class="lm_hero">
    <h1>JavaScript 数组方法图解</h1>
    <p>数组是装在格子里的数据 —— 点击下方任意方法，看它如何操作这些格子</p>
</header>

<main>
    <!-- 演示舞台 -->
    <section class="lm_stage">
        <div class="lm_stage-head">
            <span class="lm_badge" id="lm_catBadge">等待演示</span>
            <h2 id="lm_methodName">请选择一个方法</h2>
        </div>
        <p class="lm_syntax" id="lm_methodSyntax"></p>
        <p class="lm_desc" id="lm_methodDesc">点击下方的方法按钮，这里会展示该方法的语法、说明与运行效果。</p>

        <pre class="lm_code" id="lm_methodCode"><span class="lm_cm">// 示例代码将显示在这里</span></pre>

        <div class="lm_arr-row">
            <div class="lm_arr-label">执行前</div>
            <div class="lm_arr-box" id="lm_beforeBox"><div class="lm_empty">← 点击方法按钮开始演示</div></div>
        </div>
        <div class="lm_arr-row">
            <div class="lm_arr-label">执行后</div>
            <div class="lm_arr-box" id="lm_afterBox"></div>
        </div>

        <div class="lm_formula" id="lm_formulaBox"></div>
        <div class="lm_ret" id="lm_retBox"></div>
        <div class="lm_note" id="lm_noteBox"></div>
    </section>

    <!-- 方法面板 -->
    <section class="lm_panel">
        <h3>方法列表（点击演示）</h3>
        <div id="lm_groups"></div>
    </section>

<script>
/* ============ 演示数据 ============
   每个方法：
   name 名称 / lm_group 分组 / lm_syntax 语法 / lm_desc 说明
   lm_code 示例代码 / init 初始数组
   before 执行前标记  out:{arr, marks} 执行后
   lm_ret 返回值  lm_note 补充知识点  lm_formula 计算过程
------------------------------------ */
const lm_GROUPS = ["增删元素", "查找与判断", "遍历与变换", "排序与重组"];

const lm_demos = [
    /* ---------- 增删元素 ---------- */
    {
        name: "push()", lm_group: "增删元素",
        lm_syntax: "arr.push(element1, ..., elementN)",
        lm_desc: "把一个或多个元素添加到数组【末尾】，就像往队伍最后排入一个新队员。",
        lm_code: `fruits.push('🍊');  <span class="lm_cm">// 末尾加入橙子</span>`,
        init: ["🍎","🍌","🍇","🍒"],
        before: {},
        out: { arr: ["🍎","🍌","🍇","🍒","🍊"], marks: { lm_added: [4] } },
        lm_ret: "<b>5</b>（返回的是新数组的长度，不是数组本身）",
        lm_note: "push() 会修改原数组。"
    },
    {
        name: "pop()", lm_group: "增删元素",
        lm_syntax: "arr.pop()",
        lm_desc: "删除数组的【最后一个】元素，就像队伍最后的人离队。",
        lm_code: `fruits.pop();  <span class="lm_cm">// 最后的 🍒 被移除</span>`,
        init: ["🍎","🍌","🍇","🍒"],
        before: { lm_removed: [3] },
        out: { arr: ["🍎","🍌","🍇"], marks: {} },
        lm_ret: `"<b>🍒</b>"（返回被删除的那个元素）`,
        lm_note: "数组为空时 pop() 返回 undefined。"
    },
    {
        name: "unshift()", lm_group: "增删元素",
        lm_syntax: "arr.unshift(element1, ...)",
        lm_desc: "把一个或多个元素添加到数组【开头】，就像有人插队到最前面。",
        lm_code: `fruits.unshift('🍊');  <span class="lm_cm">// 开头插入橙子</span>`,
        init: ["🍎","🍌","🍇","🍒"],
        before: {},
        out: { arr: ["🍊","🍎","🍌","🍇","🍒"], marks: { lm_added: [0] } },
        lm_ret: "<b>5</b>（新数组的长度）",
        lm_note: "开头插入会导致后面所有元素索引 +1，性能不如 push()。"
    },
    {
        name: "shift()", lm_group: "增删元素",
        lm_syntax: "arr.shift()",
        lm_desc: "删除数组的【第一个】元素，其余元素整体向前挪一格。",
        lm_code: `fruits.shift();  <span class="lm_cm">// 最前面的 🍎 被移除</span>`,
        init: ["🍎","🍌","🍇","🍒"],
        before: { lm_removed: [0] },
        out: { arr: ["🍌","🍇","🍒"], marks: {} },
        lm_ret: `"<b>🍎</b>"（返回被删除的那个元素）`,
        lm_note: "shift() + push() 组合可以把数组当成队列使用。"
    },
    {
        name: "splice()", lm_group: "增删元素",
        lm_syntax: "arr.splice(start, deleteCount, item1, ...)",
        lm_desc: "数组界的“瑞士军刀”：从任意位置删除若干元素，并可同时插入新元素。",
        lm_code: `fruits.splice(1, 1, '🥭', '🍑');\n<span class="lm_cm">// 从索引1开始删1个(🍇)，再插入 🥭🍑</span>`,
        init: ["🍎","🍌","🍇","🍒"],
        before: { lm_removed: [2] },
        out: { arr: ["🍎","🍌","🥭","🍑","🍒"], marks: { lm_added: [2,3] } },
        lm_ret: `[<b>"🍇"</b>]（返回由被删除元素组成的新数组）`,
        lm_note: "splice() 会直接修改原数组，是最容易用错的方法之一。"
    },
    {
        name: "slice()", lm_group: "增删元素",
        lm_syntax: "arr.slice(start, end)  // 不含 end",
        lm_desc: "“切”出数组的一段，返回新数组。注意范围是 [start, end)，即包头不包尾。",
        lm_code: `fruits.slice(1, 3);  <span class="lm_cm">// 取索引 1~2，不含 3</span>`,
        init: ["🍎","🍌","🍇","🍒"],
        before: { lm_inrange: [1,2], lm_dimmed: [0,3] },
        out: { arr: ["🍇","🍒"], marks: { lm_changed: [0,1] } },
        lm_ret: `[<b>"🍇", "🍒"</b>]`,
        lm_note: "slice() 不修改原数组 —— 这是它与 splice() 最大的区别！"
    },

    /* ---------- 查找与判断 ---------- */
    {
        name: "indexOf()", lm_group: "查找与判断",
        lm_syntax: "arr.indexOf(searchElement)",
        lm_desc: "从头到尾查找某个元素，返回它第一次出现的索引。",
        lm_code: `fruits.indexOf('🍇');  <span class="lm_cm">// 找 🍇 在哪个格子</span>`,
        init: ["🍎","🍌","🍇","🍒"],
        before: { lm_matched: [2] },
        out: { arr: ["🍎","🍌","🍇","🍒"], marks: { lm_matched: [2] } },
        lm_ret: "<b>2</b>（找到时返回索引）",
        lm_note: "找不到时返回 -1，常用 if(arr.indexOf(x) !== -1) 判断存在性。"
    },
    {
        name: "includes()", lm_group: "查找与判断",
        lm_syntax: "arr.includes(searchElement)",
        lm_desc: "判断数组是否包含某个元素，返回 true / false，比 indexOf 更直观。",
        lm_code: `fruits.includes('🍒');  <span class="lm_cm">// 有没有 🍒 ？</span>`,
        init: ["🍎","🍌","🍇","🍒"],
        before: { lm_matched: [3] },
        out: { arr: ["🍎","🍌","🍇","🍒"], marks: { lm_matched: [3] } },
        lm_ret: "<b>true</b>",
        lm_note: "ES2016 新增，能正确判断 NaN（indexOf 做不到）。"
    },
    {
        name: "find()", lm_group: "查找与判断",
        lm_syntax: "arr.find(callback)",
        lm_desc: "按条件查找，返回第一个满足条件的【元素本身】（而不是索引）。",
        lm_code: `nums.find(x => x > 3);  <span class="lm_cm">// 第一个大于 3 的数</span>`,
        init: [1,2,3,4,5],
        before: { lm_matched: [3], lm_num: true },
        out: { arr: [1,2,3,4,5], marks: { lm_matched: [3], lm_num: true } },
        lm_ret: "<b>4</b>（不是索引 3，而是元素 4）",
        lm_note: "找不到返回 undefined；配套的 findIndex() 返回索引。"
    },
    {
        name: "some()", lm_group: "查找与判断",
        lm_syntax: "arr.some(callback)",
        lm_desc: "问一个问题：“是否存在至少一个满足条件的元素？”—— 一个满足即为 true。",
        lm_code: `nums.some(x => x > 4);  <span class="lm_cm">// 有没有大于 4 的？</span>`,
        init: [1,2,3,4,5],
        before: { lm_matched: [4], lm_num: true },
        out: { arr: [1,2,3,4,5], marks: { lm_matched: [4], lm_num: true } },
        lm_ret: "<b>true</b>（因为 5 > 4）",
        lm_note: "类似逻辑中的“或”（||）：全不满足才返回 false。"
    },
    {
        name: "every()", lm_group: "查找与判断",
        lm_syntax: "arr.every(callback)",
        lm_desc: "问一个更严格的问题：“是不是所有元素都满足条件？”—— 一个不满足即为 false。",
        lm_code: `nums.every(x => x > 0);  <span class="lm_cm">// 全部都大于 0 吗？</span>`,
        init: [1,2,3,4,5],
        before: { lm_matched: [0,1,2,3,4], lm_num: true },
        out: { arr: [1,2,3,4,5], marks: { lm_matched: [0,1,2,3,4], lm_num: true } },
        lm_ret: "<b>true</b>（每个元素都通过检验）",
        lm_note: "类似逻辑中的“与”（&&）：全部满足才返回 true。"
    },

    /* ---------- 遍历与变换 ---------- */
    {
        name: "forEach()", lm_group: "遍历与变换",
        lm_syntax: "arr.forEach(callback(item, index))",
        lm_desc: "逐个“访问”每个元素并执行操作，是最基础的遍历方法。看！访问者正在逐格前进——",
        lm_code: `nums.forEach(x => console.log(x));\n<span class="lm_cm">// 依次打印 1 2 3 4 5</span>`,
        init: [1,2,3,4,5],
        before: { lm_seq: [0,1,2,3,4], lm_num: true },
        out: { arr: [1,2,3,4,5], marks: { lm_num: true } },
        lm_ret: "<b>undefined</b>（forEach 没有返回值）",
        lm_note: "需要中途跳出请用 for / for...of；需要返回新数组请用 map()。"
    },
    {
        name: "map()", lm_group: "遍历与变换",
        lm_syntax: "arr.map(callback)",
        lm_desc: "对每个元素进行“加工”，返回一个全新的数组 —— 原数组一根汗毛都不会少。",
        lm_code: `nums.map(x => x * 10);  <span class="lm_cm">// 每个元素 ×10</span>`,
        init: [1,2,3,4,5],
        before: { lm_num: true },
        out: { arr: [10,20,30,40,50], marks: { lm_changed: [0,1,2,3,4], lm_num: true } },
        lm_ret: `[<b>10, 20, 30, 40, 50</b>]（新数组，长度与原数组相同）`,
        lm_note: "map() 不修改原数组，是函数式编程的核心方法之一。"
    },
    {
        name: "filter()", lm_group: "遍历与变换",
        lm_syntax: "arr.filter(callback)",
        lm_desc: "像筛子一样筛选：满足条件的留下（绿色），不满足的被筛掉（打 ✕）。",
        lm_code: `nums.filter(x => x % 2 === 1);  <span class="lm_cm">// 筛出奇数</span>`,
        init: [1,2,3,4,5],
        before: { lm_dimmed: [1,3], lm_num: true },
        out: { arr: [1,3,5], marks: { lm_changed: [0,1,2], lm_num: true } },
        lm_ret: `[<b>1, 3, 5</b>]（新数组，长度可以不同）`,
        lm_note: "回调函数返回 true 的元素才会被保留。"
    },
    {
        name: "reduce()", lm_group: "遍历与变换",
        lm_syntax: "arr.reduce(callback(accumulator, current), initValue)",
        lm_desc: "“压缩”数组：带着一个累加器从头走到尾，把所有元素聚合成一个值。",
        lm_code: `nums.reduce((acc, cur) => acc + cur, 0);\n<span class="lm_cm">// 把所有数加起来</span>`,
        init: [1,2,3,4,5],
        before: { lm_num: true },
        out: { arr: [15], marks: { lm_added: [0], lm_num: true } },
        lm_ret: "<b>15</b>（聚合后的单个值）",
        lm_note: "reduce 不只能求和：求最大值、分组、计数都能做。",
        lm_formula: "0+1=1 → 1+2=3 → 3+3=6 → 6+4=10 → 10+5=15   ← 累加器一路前行"
    },

    /* ---------- 排序与重组 ---------- */
    {
        name: "sort()", lm_group: "排序与重组",
        lm_syntax: "arr.sort(compareFn)",
        lm_desc: "对数组原地排序，默认按【字符串】顺序比较 —— 这就是数字排序的经典大坑！",
        lm_code: `[3,1,10,2].sort();           <span class="lm_cm">// ❌ [1,10,2,3] 按字典序！</span>
[3,1,10,2].sort((a,b)=>a-b); <span class="lm_cm">// ✅ [1,2,3,10]</span>`,
        init: [3,1,10,2],
        before: { lm_num: true },
        out: { arr: [1,2,3,10], marks: { lm_changed: [0,1,2,3], lm_num: true } },
        lm_ret: "<b>[1, 2, 3, 10]</b>（修改并返回原数组的引用）",
        lm_note: "数字排序必须传比较函数 (a,b)=>a-b；sort() 会直接修改原数组。"
    },
    {
        name: "reverse()", lm_group: "排序与重组",
        lm_syntax: "arr.reverse()",
        lm_desc: "把数组整个【倒过来】，第一个变最后一个。",
        lm_code: `nums.reverse();  <span class="lm_cm">// 反转</span>`,
        init: [1,2,3,4,5],
        before: { lm_num: true },
        out: { arr: [5,4,3,2,1], marks: { lm_changed: [0,1,2,3,4], lm_num: true } },
        lm_ret: "<b>[5, 4, 3, 2, 1]</b>",
        lm_note: "同样会修改原数组；想不改原数组可用 [...arr].reverse()。"
    },
    {
        name: "join()", lm_group: "排序与重组",
        lm_syntax: "arr.join(separator)",
        lm_desc: "把所有元素用指定分隔符连起来，变成一个字符串。",
        lm_code: `fruits.join('-');  <span class="lm_cm">// 用 - 连接</span>`,
        init: ["🍎","🍌","🍇","🍒"],
        before: {},
        out: { arr: ["🍎-🍌-🍇-🍒"], marks: { lm_changed: [0], lm_strval: [0] } },
        lm_ret: `"<b>🍎-🍌-🍇-🍒</b>"（一个字符串）`,
        lm_note: "join('') 可无缝拼接；不传参数时默认用逗号连接。"
    },
    {
        name: "concat()", lm_group: "排序与重组",
        lm_syntax: "arr.concat(other1, other2, ...)",
        lm_desc: "合并多个数组（或值），返回一个更大的新数组，原数组保持不变。",
        lm_code: `fruits.concat(['🍊','🍉']);  <span class="lm_cm">// 拼接两个数组</span>`,
        init: ["🍎","🍌","🍇","🍒"],
        before: {},

        name: "flat()", lm_group: "排序与重组",
        lm_syntax: "arr.flat(depth)",
        lm_desc: "把嵌套的数组“压平”，就像把纸箱里的盒子全部拿出来摆成一排。",
        lm_code: `nested.flat();  <span class="lm_cm">// 默认压平 1 层</span>`,
        init: [[1,2],[3,4],[5,6]],
        before: { lm_num: true },
        out: { arr: [1,2,3,4,5,6], marks: { lm_changed: [0,1,2,3,4,5], lm_num: true } },
        lm_ret: "<b>[1, 2, 3, 4, 5, 6]</b>",
        lm_note: "flat(Infinity) 可以压平任意深度；ES2019 新增。"
    }
];

/* ============ 渲染 ============ */
const lm_$ = id => document.getElementById(id);

function lm_cellHTML(v, i, marks, isNum, isStr) {
    const cell = document.createElement("div");
    let cls = "lm_cell";
    if (isNum) cls += " lm_num";
    if (isStr && marks.lm_strval?.includes(i)) cls += " lm_strval";
    ["lm_removed","lm_matched","lm_dimmed","lm_inrange","lm_added","lm_changed"].forEach(k => {
        if (marks[k]?.includes(i)) cls += " " + k;
    });
    if (marks.lm_seq?.includes(i)) {
        cls += " lm_seq";
        cell.style.setProperty("--i", i);
    }
    cell.className = cls;
    cell.style.setProperty("--d", (i * 0.06) + "s");

    if (Array.isArray(v)) {                       // 嵌套数组（flat）
        cell.classList.add("lm_nested");
        v.forEach(sv => {
            const s = document.createElement("span");
            s.className = "lm_subcell";
            s.textContent = sv;
            cell.appendChild(s);
        });
    } else {
        cell.textContent = v;
    }
    const idx = document.createElement("span");   // 索引角标
    idx.className = "lm_idx";
    idx.textContent = i;
    cell.appendChild(idx);
    return cell;
}

function lm_renderBox(box, arr, marks = {}, isNum = false, isStr = false) {
    box.innerHTML = "";
    if (!arr.length) {
        box.innerHTML = '<div class="lm_empty">（空数组 []）</div>';
        return;
    }
    arr.forEach((v, i) => box.appendChild(lm_cellHTML(v, i, marks, isNum, isStr)));
}

function lm_showDemo(d) {
    // 文字信息
    lm_$("lm_catBadge").textContent = d.lm_group;
    lm_$("lm_methodName").textContent = d.name;
    lm_$("lm_methodSyntax").textContent = "语法：" + d.lm_syntax;
    lm_$("lm_methodDesc").textContent = d.lm_desc;
    lm_$("lm_methodCode").innerHTML = d.lm_code;
    lm_$("lm_retBox").innerHTML = "<b>返回值：</b>" + d.lm_ret;

    const lm_note = lm_$("lm_noteBox");
    if (d.lm_note) { lm_note.textContent = "💡 " + d.lm_note; lm_note.classList.add("lm_show"); }
    else lm_note.classList.remove("lm_show");

    // 执行前
    lm_renderBox(lm_$("lm_beforeBox"), d.init, d.before || {}, d.before?.lm_num, d.before?.lm_strval);

    // 执行后（延迟呈现，制造“运行”过程感）
    const fBox = lm_$("lm_formulaBox");
    fBox.classList.remove("lm_show");
    lm_$("lm_afterBox").innerHTML = '<div class="lm_empty">⏳ 正在执行…</div>';
    setTimeout(() => {
        lm_renderBox(lm_$("lm_afterBox"), d.out.arr, d.out.marks, d.out.marks?.lm_num, d.out.marks?.lm_strval);
        if (d.lm_formula) { fBox.textContent = d.lm_formula; fBox.classList.add("lm_show"); }
    }, 550);
}

/* ============ 生成方法按钮 ============ */
const groupsBox = lm_$("lm_groups");
lm_GROUPS.forEach(g => {
    const sec = document.createElement("div");
    sec.className = "lm_group";
    sec.innerHTML = `<div class="lm_group-title">${g}</div>`;
    const btns = document.createElement("div");
    btns.className = "lm_btns";
    lm_demos.filter(d => d.lm_group === g).forEach(d => {
        const b = document.createElement("button");
        b.textContent = d.name;
        b.onclick = () => {
            document.querySelectorAll(".lm_btns button").forEach(x => x.classList.remove("lm_active"));
            b.classList.add("lm_active");
            lm_showDemo(d);
        };
        btns.appendChild(b);
    });
    sec.appendChild(btns);
    groupsBox.appendChild(sec);
});

/* 默认演示 push() */
document.querySelector(".lm_btns button").click();
</script>
