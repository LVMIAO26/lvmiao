<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>16-3 · 为你推荐</title>
<link rel="stylesheet" href="./font/iconfont.css?v=1">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
        background: #101010;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 16px;
    }

    /* 返回首页 */
    .lm_back {
        position: fixed;
        top: 16px; right: 18px;
        color: rgba(255,255,255,.75);
        background: rgba(255,255,255,.08);
        border: 1px solid rgba(255,255,255,.2);
        padding: 5px 14px;
        border-radius: 20px;
        font-size: 13px;
        text-decoration: none;
        transition: all .2s ease;
    }
    .lm_back:hover { background: rgba(255,255,255,.18); color: #fff; }

    /* ===== 小组件面板 ===== */
    .lm_widget {
        position: relative;
        width: 460px;
        max-width: 100%;
        background: #1f1f1f;
        border-radius: 18px;
        padding: 20px 20px 12px;
        box-shadow: 0 24px 70px rgba(0,0,0,.65);
    }

    /* 头部 */
    .lm_head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 2px 4px 16px;
    }
    .lm_head_left { display: flex; align-items: center; gap: 10px; }

    /* 蓝色认证徽章（CSS 绘制：圆 + 白勾） */
    .lm_badge {
        position: relative;
        width: 26px; height: 26px;
        background: linear-gradient(145deg, #3d8bfd, #1f6fe0);
        border-radius: 50%;
        box-shadow: 0 0 0 3px rgba(61,139,253,.18);
        flex: 0 0 auto;
    }
    .lm_badge::after {
        content: "";
        position: absolute;
        left: 8px; top: 6.5px;
        width: 8px; height: 12px;
        border: solid #fff;
        border-width: 0 2.5px 2.5px 0;
        transform: rotate(42deg);
    }

    .lm_title { color: #fff; font-size: 17px; font-weight: 700; letter-spacing: 1px; }

    .lm_more {
        background: none; border: none;
        color: rgba(255,255,255,.85);
        font-size: 22px;
        letter-spacing: 2px;
        cursor: pointer;
        padding: 2px 6px;
        border-radius: 6px;
        line-height: 1;
    }
    .lm_more:hover { background: rgba(255,255,255,.1); }

    /* ===== 列表 ===== */
    .lm_list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-height: 360px;
    }
    .lm_page { display: none; flex-direction: column; gap: 12px; }
    .lm_page.active { display: flex; animation: lm_fadein .35s ease both; }

    @keyframes lm_fadein {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    .lm_item {
        display: flex;
        align-items: center;
        gap: 14px;
        background: #3c3c3c;
        border-radius: 30px;
        padding: 9px 10px 9px 12px;
        min-height: 62px;
        transition: background .2s ease;
    }
    .lm_item:hover { background: #464646; }

    /* 圆形 logo（白底 + 品牌色字） */
    .lm_logo {
        flex: 0 0 44px;
        width: 44px; height: 44px;
        background: #fff;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 17px;
        font-weight: 800;
        box-shadow: inset 0 0 0 1px rgba(0,0,0,.08);
        user-select: none;
    }
    .lm_logo img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

    .lm_name {
        flex: 1;
        color: #fff;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 1px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    /* 加号按钮（iconfont 添加图标） */
    .lm_add {
        flex: 0 0 32px;
        width: 32px; height: 32px;
        border: none;
        border-radius: 50%;
        background: #fff;
        color: #1f1f1f;
        font-size: 16px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform .18s ease, background .18s ease, color .18s ease;
    }
    .lm_add .iconfont { font-size: 16px; line-height: 1; }
    .lm_add:hover { transform: scale(1.12); }
    .lm_add:active { transform: scale(.94); }

    /* 已关注状态：蓝底白勾 */
    .lm_add.lm_done { background: #2f7beb; color: #fff; }
    .lm_add.lm_done::after {
        content: "";
        width: 9px; height: 14px;
        border: solid #fff;
        border-width: 0 2.5px 2.5px 0;
        transform: rotate(42deg) translate(-1px, -2px);
    }

    /* 左右翻页箭头 */
    .lm_arrow {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: rgba(255,255,255,.38);
        font-size: 22px;
        font-family: "Segoe UI Symbol", sans-serif;
        cursor: pointer;
        padding: 10px 4px;
        line-height: 1;
        border-radius: 8px;
        user-select: none;
        transition: color .2s ease, background .2s ease;
    }
    .lm_arrow:hover { color: rgba(255,255,255,.85); background: rgba(255,255,255,.08); }
    .lm_arrow.lm_prev { left: 3px; }
    .lm_arrow.lm_next { right: 3px; }

    /* 底部：全部资源 */
    .lm_foot {
        display: flex;
        justify-content: flex-end;
        padding: 12px 8px 6px;
    }
    .lm_all {
        color: #5aa2ff;
        font-size: 13px;
        text-decoration: none;
        letter-spacing: 1px;
    }
    .lm_all:hover { text-decoration: underline; }

    @media (max-width: 520px) {
        .lm_widget { padding: 16px 12px 10px; }
        .lm_name { font-size: 14px; }
    }
</style>
</head>
<body>
    <!-- 姓名：袁磊，日期：2026-10-29，功能名称：为你推荐 · 深色小组件面板 -->
    <a class="lm_back" href="./index.html">← 返回首页</a>

    <section class="lm_widget">
        <header class="lm_head">
            <div class="lm_head_left">
                <span class="lm_badge"></span>
                <h1 class="lm_title">为你推荐</h1>
            </div>
            <button class="lm_more" title="更多">···</button>
        </header>

        <ul class="lm_list" id="lm_list"></ul>

        <button class="lm_arrow lm_prev" id="lm_prev" title="上一页">‹</button>
        <button class="lm_arrow lm_next" id="lm_next" title="下一页">›</button>

        <footer class="lm_foot">
            <a class="lm_all" href="javascript:;">全部资源</a>
        </footer>
    </section>

<script>
/* ===================== 数据 ===================== */
const lm_pages = [
    [
        { name: "每日经济新闻", tag: "每", color: "#d92b2b" },
        { name: "证券之星",     tag: "证", color: "#cf2318" },
        { name: "中关村在线",   tag: "Z",  color: "#1f6fce" },
        { name: "环球网财经",   tag: "环", color: "#1f5fc4" },
        { name: "爱享美食家",   tag: "🍴", color: "#e0483a" }
    ],
    [
        { name: "虎嗅 APP", tag: "虎", color: "#ff6a00" },
        { name: "36氪",     tag: "36", color: "#2b7de9" },
        { name: "少数派",   tag: "少", color: "#4c6ef5" },
        { name: "爱范儿",   tag: "爱", color: "#e64c3c" },
        { name: "IT之家",   tag: "IT", color: "#2b7de9" }
    ]
];

let lm_cur = 0;
const lm_state = new Map();   // 记录关注状态：name -> true/false

const lm_list = document.getElementById("lm_list");

/* ===================== 渲染 ===================== */
function lm_render() {
    lm_list.innerHTML = "";
    const ul = document.createElement("ul");
    ul.className = "lm_page active";

    lm_pages[lm_cur].forEach(item => {
        const done = !!lm_state.get(item.name);

        const li = document.createElement("li");
        li.className = "lm_item";

        const logo = document.createElement("span");
        logo.className = "lm_logo";
        logo.style.color = item.color;
        logo.textContent = item.tag;

        const name = document.createElement("span");
        name.className = "lm_name";
        name.textContent = item.name;

        const add = document.createElement("button");
        add.className = "lm_add" + (done ? " lm_done" : "");
        add.title = done ? "取消关注" : "添加关注";
        if (!done) {
            const icon = document.createElement("span");
            icon.className = "iconfont icon-tianjia1";
            add.appendChild(icon);
        }

        add.addEventListener("click", () => {
            const next = !lm_state.get(item.name);
            lm_state.set(item.name, next);
            lm_render();
        });

        li.appendChild(logo);
        li.appendChild(name);
        li.appendChild(add);
        ul.appendChild(li);
    });

    lm_list.appendChild(ul);
}

/* ===================== 翻页 ===================== */
document.getElementById("lm_prev").addEventListener("click", () => {
    lm_cur = (lm_cur - 1 + lm_pages.length) % lm_pages.length;
    lm_render();
});
document.getElementById("lm_next").addEventListener("click", () => {
    lm_cur = (lm_cur + 1) % lm_pages.length;
    lm_render();
});

/* 初始渲染 */
lm_render();
</script>
</body>
</html>
