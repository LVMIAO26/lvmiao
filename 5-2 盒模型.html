<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盒模型、框模型、box model </title>
    <style>
        body,ul,p,h1,h2,h3,h4,h5,h6{
            margin:0;
            padding:0;
        }
        /*尽量少用*通配符*/
        ul{
            list-style: none;
        }
        .a{
            width: 500px;
            height: 300px;
            border:2px dotted red;/*边框*/
            padding: 70px 60px 50px 40px;/*上右下左*/
            margin:40px auto;
            /*上下、左右，左右margin为auto居中*/
        }
        /* 盒子的高度：内容的高度 + padding + border+ margin */
        .b{
            width: 500px;
            height: 300px;
            border:2px dashed #039;
            margin:50px auto 40px;/*上、左右、下*/
        }
        .c{
            width: 500px;
            height: 300px;
            border:4px solid orange;
            padding: 20px 10px 10px 20px;
            margin:10px auto 40px;/*上、左右、下*/
        }
    </style>
</head>
<body>
    <div class="a">930吕淼</div>
    <div class="b">930吕淼</div>
    <div class="c">930吕淼</div>
</body>
</html>
